[package]
name = "actix-msgpack"
version = "0.1.4"
authors = ["ym-project <ym-project@protonmail.com>"]
edition = "2021"
rust-version = "1.56"
description = "Msgpack payload extractor for Actix Web"
repository = "https://github.com/ym-project/actix-msgpack/tree/v4"
license = "MIT"
keywords = ["actix", "web", "actix-web", "msgpack", "protocol"]
exclude = [
	".github",
	".vscode",
	".gitignore",
	"rustfmt.toml",
]

[dependencies]
actix-web = { version = "4", default-features = false }
derive_more = { version = "2.1.1", default-features = false, features = ["display"] }
futures-util = { version = "0.3.32", default-features = false }
mime = "0.3.17"
rmp-serde = "1.3.1"
serde = { version = "1.0.228", default-features = false }

[dev-dependencies]
actix-web = { version = "4", default-features = false, features = ["macros"] }
serde = { version = "1.0.228", features = ["derive"] }
